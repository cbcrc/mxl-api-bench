name: mxl-api-bench

volumes:
  mxl-domain:
    driver: local
    driver_opts:
      type: tmpfs
      device: none
      o: nosuid,strictatime,mode=0755

services:
  domain-init:
    # Stays running for the life of the stack: Docker's local+tmpfs volume
    # driver unmounts (and wipes) the tmpfs once its last mounter exits, so a
    # one-shot seed container would race the app container and lose the
    # copied file. Holding the mount open here keeps the tmpfs alive.
    image: busybox
    init: true   # run tini as PID 1 so SIGTERM actually reaches `tail` below instead
                 # of being ignored per the kernel's default PID-1 signal exemption
    volumes:
      - mxl-domain:/mxl-domain
      - ./domain_def.json:/seed/domain_def.json:ro
    entrypoint: ["sh", "-c", "cp /seed/domain_def.json /mxl-domain/domain_def.json && exec tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "test", "-f", "/mxl-domain/domain_def.json"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  mxl-api-bench:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: mxl-api-bench:latest
    container_name: mxl-api-bench
    hostname: mxl-api-bench
    domainname: local
    depends_on:
      domain-init:
        condition: service_healthy
    ports:
      - "9607:9600"   # the C++ backend serves both the API and the React frontend
    volumes:
      - type: volume
        source: mxl-domain
        target: /mxl-domain
      # Scenarios saved from the UI land in the working tree, and new ones are
      # picked up without a rebuild.
      - type: bind
        source: ./scenarios
        target: /app/scenarios
      # Event-log NDJSON, only when MXL_API_BENCH_LOG_FILE is set below. Nothing is
      # written unless it is -- the default is an in-memory tail and nothing on disk.
      - type: bind
        source: ./logs
        target: /app/logs
    environment:
      - MXL_DOMAIN_ROOT=/mxl-domain
      - SCENARIO_DIR=/app/scenarios
      # Uncomment to mirror every event to ./logs/. Appends; a second run of the same
      # process writes events.2.ndjson, so `read_json_auto('*.ndjson')` still finds
      # every run. A load sweep makes this large -- the cap is in bytes.
      # - MXL_API_BENCH_LOG_FILE=/app/logs/events.ndjson
      # - MXL_API_BENCH_LOG_MAX_BYTES=2000000000